name: Sync upstream and deploy

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制构建并部署当前 main（仅手动运维使用）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
      commit: ${{ steps.merge.outputs.commit }}
    steps:
      - name: Merge upstream main into fork
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ inputs.force_deploy || 'false' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$FORCE_DEPLOY" == "true" ]]; then
            current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "commit=$current" >> "$GITHUB_OUTPUT"
            echo "Force deploy requested: ${current:0:12}"
            exit 0
          fi
          response="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main)"
          merge_commit="$(jq -r '.merge_commit_sha // empty' <<<"$response")"
          if [[ -n "$merge_commit" ]]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "commit=$merge_commit" >> "$GITHUB_OUTPUT"
            echo "Upstream changes merged: ${merge_commit:0:12}"
          else
            current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "commit=$current" >> "$GITHUB_OUTPUT"
            echo "No upstream update: ${current:0:12}"
          fi

  build-and-deploy:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout synchronized fork
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore Chromium runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .docker/playwright-runtime/amd64
          key: ydisks-playwright-runtime-v6-docker-amd64-debian13-x64-${{ hashFiles('go.mod', 'go.sum', 'cmd/browser-install/**') }}

      - name: Prepare Chromium runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        env:
          GOARCH: amd64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: debian13-x64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .docker/playwright-runtime/amd64/playwright-driver \
            .docker/playwright-runtime/amd64/playwright-browsers
          GOOS=linux GOARCH="$GOARCH" CGO_ENABLED=0 go build \
            -trimpath -ldflags='-s -w' \
            -o "$RUNNER_TEMP/browser-install" ./cmd/browser-install
          "$RUNNER_TEMP/browser-install" \
            -driver-dir "$PWD/.docker/playwright-runtime/amd64/playwright-driver" \
            -browser-dir "$PWD/.docker/playwright-runtime/amd64/playwright-browsers"

      - name: Validate Chromium runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_dir="$PWD/.docker/playwright-runtime/amd64"
          test -x "$runtime_dir/playwright-driver/node"
          test -f "$runtime_dir/playwright-driver/package/cli.js"
          test -n "$(find "$runtime_dir/playwright-browsers" -type f \
            \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) \
            -perm -111 -print -quit)"

      - name: Save Chromium runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .docker/playwright-runtime/amd64
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debian13
          load: true
          push: false
          tags: ydisks-xianyu-helper:${{ needs.sync.outputs.commit }}
          cache-from: type=gha,scope=ydisks-xianyu-helper
          cache-to: type=gha,mode=max,scope=ydisks-xianyu-helper

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Install server host key
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stream image to server
        shell: bash
        env:
          IMAGE: ydisks-xianyu-helper:${{ needs.sync.outputs.commit }}
        run: |
          set -Eeuo pipefail
          docker save "$IMAGE" | gzip -1 | ssh -p 20007 root@43.248.3.158 'gunzip | docker load'

      - name: Deploy and verify
        shell: bash
        env:
          IMAGE: ydisks-xianyu-helper:${{ needs.sync.outputs.commit }}
        run: |
          set -Eeuo pipefail
          ssh -p 20007 root@43.248.3.158 \
            "XIANYU_SKIP_PULL=1 /usr/local/sbin/update-ydisks-xianyu-helper '$IMAGE'"
          curl --fail --silent --show-error --max-time 20 \
            http://43.248.3.158:25777/health
          echo
