name: Sync upstream and deploy

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    steps:
      - name: Checkout fork history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check and merge upstream only when changed
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote add upstream https://github.com/Christ9038/Ydisks-Xianyu-Helper.git
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No upstream change: ${upstream_sha:0:12}"
            exit 0
          fi

          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main >/tmp/merge.json
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor upstream/main origin/main; then
            echo "Fork synchronization did not include upstream ${upstream_sha}" >&2
            cat /tmp/merge.json >&2
            exit 1
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "Upstream synchronized: ${upstream_sha:0:12}"

  deploy:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Install server host key
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Wait for upstream image
        env:
          IMAGE: ghcr.io/christ9038/ydisks-xianyu-helper:sha-${{ needs.sync.outputs.upstream_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "Image is ready: $IMAGE"
              exit 0
            fi
            echo "Waiting for upstream image ($attempt/30)..."
            sleep 60
          done
          echo "Timed out waiting for $IMAGE" >&2
          exit 1

      - name: Deploy exact upstream revision
        env:
          IMAGE: ghcr.io/christ9038/ydisks-xianyu-helper:sha-${{ needs.sync.outputs.upstream_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p 20072 root@43.248.3.161 \
            "/usr/local/sbin/update-ydisks-xianyu-helper '$IMAGE'"
          curl --fail --silent --show-error --max-time 20 \
            http://43.248.3.161:33402/health
          echo

  notify:
    runs-on: ubuntu-latest
    needs: [sync, deploy]
    if: always() && needs.sync.outputs.updated == 'true'
    steps:
      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$DEPLOY_RESULT" = "success" ]; then
            title="✅ 闲鱼助手已更新部署"
            detail="上游新版本 ${UPSTREAM_SHA:0:12} 已合并并部署到服务器，健康检查通过。"
          else
            title="⚠️ 闲鱼助手更新部署异常"
            detail="上游 ${UPSTREAM_SHA:0:12} 已合并，但部署结果: $DEPLOY_RESULT，请检查 Actions 日志。"
          fi
          message=$(printf '%s\n\n%s' "$title" "$detail")
          body=$(jq -nc --arg text "$message" '{msg_type:"text",content:{text:$text}}')
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            -d "$body" "$FEISHU_WEBHOOK"
